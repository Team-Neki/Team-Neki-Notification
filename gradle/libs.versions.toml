[versions]
kotlin = "2.0.21"
springBoot = "3.4.5"
springDependencyManagement = "1.1.7"
kover = "0.9.1"
firebaseAdmin = "9.4.3"
postgresql = "42.7.5"
mockk = "1.13.13"
testcontainers = "1.20.6"
jooq = "3.19.22"          # Spring Boot 3.4.5 BOM이 관리하는 런타임 jOOQ와 일치(codegen=runtime)
jooqPlugin = "9.0"        # nu.studer.jooq (jOOQ 3.19 지원)
archunit = "1.3.0"

[libraries]
# Spring (versions managed by Spring BOM via dependency-management plugin)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-batch = { module = "org.springframework.boot:spring-boot-starter-batch" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-batch-test = { module = "org.springframework.batch:spring-batch-test" }

# Drivers / external
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebaseAdmin" }

# Flyway (versions managed by Spring BOM)
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Kotlin test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }

# MockK
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Testcontainers
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

# ArchUnit (계층 의존성 규칙 강제)
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# jOOQ
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
jooq-codegen = { id = "nu.studer.jooq", version.ref = "jooqPlugin" }
