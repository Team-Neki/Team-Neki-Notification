name: Deploy to Prod (K3s + GitOps)

on:
  # main 머지 시 자동 배포하지 않는다.
  # 배포는 GitHub Actions 탭의 "Run workflow"(workflow_dispatch)로만 수동 트리거한다.
  workflow_dispatch:  # 수동 배포 전용

env:
  # GitOps overlays/prod/notification-deployment.yaml 의 image와 일치해야 한다.
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/neki-batch-prod
  GITOPS_REPO: Team-Neki/Team-Neki-GitOps
  GITOPS_PATH: overlays/prod/notification-deployment.yaml

jobs:
  build-and-deploy:
    name: Build and Deploy via GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 배포 산출물은 apps:batch 모듈의 bootJar 하나뿐이다.
      - name: Build batch bootJar with Gradle
        run: ./gradlew :apps:batch:bootJar --no-daemon -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # GitOps: GitOps 레포의 이미지 태그 업데이트
      # ArgoCD가 변경을 감지하여 자동 배포
      # 사전 준비: GitOps 레포에 overlays/prod/notification-deployment.yaml 이 존재해야 한다.
      #            (headless Deployment; 아래 image 라인 형식 일치 필요)
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image tag in GitOps repo
        run: |
          cd gitops
          NEW_IMAGE="${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}"
          echo "📦 Updating image to: $NEW_IMAGE"

          # notification-deployment.yaml의 이미지 태그 업데이트
          sed -i "s|image: .*neki-batch-prod:.*|image: $NEW_IMAGE|g" ${{ env.GITOPS_PATH }}

          # 변경사항 확인
          echo "📄 Updated notification-deployment.yaml:"
          grep "image:" ${{ env.GITOPS_PATH }}

      - name: Commit and push to GitOps repo
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore(notification-prod): update image to ${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}

          Triggered by: ${{ github.repository }}@${{ github.sha }}
          Author: ${{ github.actor }}"

          git push
