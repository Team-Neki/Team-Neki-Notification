spring:
  # 기본 테스트는 Flyway 비활성 — Spring Batch 메타테이블은 initialize-schema=always 로,
  # 앱 테이블은 각 테스트(E2E)가 직접 생성한다. Flyway 마이그레이션-엔티티 정합성은
  # SchemaMigrationValidationTest 가 Flyway 활성 + ddl-auto=validate 로 별도 검증한다.
  flyway:
    enabled: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
