spring:
  # 기본 테스트는 Flyway 비활성 — Spring Batch 메타테이블은 initialize-schema=always 로,
  # 앱 테이블은 각 테스트(E2E)가 직접 생성한다. Flyway 마이그레이션과 jOOQ 생성 타입의
  # 정합성은 SchemaMigrationValidationTest 가 Flyway 활성으로 별도 검증한다.
  flyway:
    enabled: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
