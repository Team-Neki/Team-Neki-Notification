spring:
  application:
    name: team-neki-notification
  batch:
    job:
      # Do not auto-run jobs on startup; jobs are launched explicitly (none defined yet in P0).
      enabled: false
    jdbc:
      # Flyway(V2__spring_batch_schema.sql)가 BATCH_* 스키마를 소유한다; 부팅 시 auto-DDL 금지.
      initialize-schema: never
  flyway:
    # 이 앱은 team-neki-server 와 동일한 공유 DB 를 사용한다. 두 앱이 기본 flyway_schema_history
    # 테이블을 공유하면 서로의 V1/V2 가 같은 version 번호로 충돌(checksum mismatch)해 기동이 깨진다.
    # → 이 앱 전용 history 테이블로 분리한다. server 의 flyway_schema_history 와 독립적으로 동작.
    table: flyway_schema_history_notification
    # 공유 스키마에는 외부 소유 테이블(tb_notification, tb_photo_image 등)이 이미 존재(non-empty)하므로
    # baseline 으로 채택한다. 단 baseline-version=0 으로 두어 V1(notification_log)부터 전부 적용되게 한다
    # (기본값 1 이면 V1 이 baseline 으로 skip 됨). 공휴일은 V1 이 만든 holiday 를 V3 로 DROP하고 인메모리로 관리.
    baseline-on-migrate: true
    baseline-version: "0"

# K8s preStop(sleep 10) + terminationGracePeriodSeconds(30)와 정합하는 graceful shutdown.
server:
  shutdown: graceful

# Actuator 헬스 — GitOps Deployment의 startup/liveness 프로브가 참조한다.
# /actuator/health/liveness · /actuator/health/readiness (8080)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

# 스케줄링 기술 인프라 타임존 (modules/scheduling: 시계 + @Scheduled cron 공통 기준).
scheduling:
  zone: Asia/Seoul

neki:
  fcm:
    # 발송 활성화 시 true + credentials-location 지정 (FirebaseConfig).
    enabled: false
  batch:
    # 스케줄러(@Scheduled) 활성화. 운영에서만 true (NotificationJobScheduler).
    scheduling-enabled: false
    # 기동 완료 이벤트 시 공휴일 CSV → 인메모리 적재 활성화. 운영에서만 true (HolidayLoader).
    holiday-sync-enabled: false
    # 공휴일 원천 CSV 경로(클래스패스). 추후 Google Sheet로 전환 예정(issue #17).
    holiday-csv: holidays.csv
    cron:
      weekly: "0 0 20 * * *"            # 매일 20:00 — 아카이빙 1주일 리마인드
      weekend: "0 0 18 * * FRI,SAT,SUN" # 금/토/일 18:00 — 주말 전 탐색
      holiday: "0 0 9 * * *"            # 매일 09:00 — 발송일 판정 후 발송
