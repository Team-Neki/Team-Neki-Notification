# prod 프로파일 — 운영에서만 활성화하는 토글 모음.
# Dockerfile의 SPRING_PROFILES_ACTIVE=prod 로 활성화된다.
# base application.yml의 기본값(false)을 운영에서 true로 오버라이드한다.

# 공유 DB(서버 앱과 동일 PostgreSQL) 접속 정보. base 에는 datasource 가 없고
# 테스트는 Testcontainers 가 주입하므로, 운영 접속 정보는 prod 프로파일에서만 설정한다.
# ENC(...) 값은 서버 앱(application-prod.yaml)과 동일하며 JASYPT_PASSWORD 로 복호화된다.
spring:
  datasource:
    url: ENC(6L4dscI6gdDvPaOeWbdeRxoASDBa1/iRneNln/W5umyHZv8npjPwh+ROkrO2ATZT7e0ymaL4fyjaUmSG1xny/OhQ95SrWvqcU9NnrOrUJ0I=)
    username: ENC(ckNqwRnQTGzy/R/bFMEEpMkHVxegFfkh60se3lsaCcsmF+YicL5deoidwLWXu77b)
    password: ENC(O5jXrCBCxZB15KDnjiPpj6bwZUf9PkdfgFpiRvijihT9665rlQwvKv6FWv9xZb6X)
    driver-class-name: org.postgresql.Driver

# spring.datasource 의 ENC(...) 복호화 키. 컨테이너 env JASYPT_PASSWORD(neki-secrets) 주입.
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD}

neki:
  fcm:
    # 실제 FCM 발송 활성화. credentials-location 필수(FirebaseConfig).
    enabled: true
    # Firebase 서비스 계정 JSON. K8s Secret을 파일로 마운트한 경로를 참조한다.
    credentials-location: file:/etc/firebase/firebase-service-account.json
  test-api:
    # 수동 트리거 테스트 API(TestNotificationController) 활성화.
    # 런북(docs/runbook/deployment.md §5)의 배포 검증 스모크가 이 엔드포인트를 전제한다.
    #
    # 주의: 이 앱에는 인증(Spring Security)이 없다. fcm.enabled=true 인 prod 에서 이 API 는
    # 호출자 누구에게나 실제 유저 대상 실발송·배치 기동 권한을 준다. 반드시 pod 내부 호출
    # 전용으로 유지할 것 — GitOps 레포(overlays/prod/notification-deployment.yaml)의
    # Service/Ingress 로 8080 을 외부(클러스터 밖)에 노출하지 말 것.
    # 호출 방법: kubectl exec / port-forward 로 pod 내부에서 curl.
    enabled: true
  batch:
    # 스케줄러(@Scheduled, NotificationJobScheduler) 활성화.
    scheduling-enabled: true
    # 기동 시 공휴일 CSV → holiday 테이블 동기화 활성화(HolidaySyncRunner).
    holiday-sync-enabled: true
